name: One-time optimize Hyprland mobile videos

on:
  push:
    branches: [fix/hyprland-mobile-video-loading]
    paths: [.github/workflows/one-time-hyprland-mobile-video.yml]

permissions:
  contents: write

jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hyprland-mobile-video-loading
          persist-credentials: true
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Encode mobile-friendly MP4s and real first-frame JPG posters
        shell: bash
        run: |
          set -euo pipefail
          source_dir="public/assets/hyprland/temas/videos-fundo"
          target_dir="public/assets/hyprland/temas/videos-mobile"
          poster_dir="public/assets/hyprland/temas/posters"
          mkdir -p "$target_dir" "$poster_dir"
          for name in changli hyuki hsin shorekeeper wutering; do
            source="$source_dir/$name.mp4"
            test -s "$source"
            echo "Original $name: $(stat -c %s "$source") bytes"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$source"
            ffmpeg -hide_banner -loglevel error -nostdin -y -i "$source" \
              -map 0:v:0 -an -vf "scale='min(1280,iw)':-2,fps=24" \
              -c:v libx264 -preset veryfast -crf 27 -pix_fmt yuv420p \
              -profile:v main -level:v 3.1 -movflags +faststart -maxrate 1800k -bufsize 3600k \
              "$target_dir/$name.mp4"
            ffmpeg -hide_banner -loglevel error -nostdin -y -ss 0.5 -i "$source" \
              -map 0:v:0 -frames:v 1 -vf "scale='min(960,iw)':-2" -q:v 4 \
              "$poster_dir/$name.jpg"
            test -s "$target_dir/$name.mp4"
            test -s "$poster_dir/$name.jpg"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of default=noprint_wrappers=1 "$target_dir/$name.mp4"
            echo "Mobile $name: $(stat -c %s "$target_dir/$name.mp4") bytes"
          done
      - name: Commit generated media to this review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/hyprland/temas/videos-mobile/ public/assets/hyprland/temas/posters/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(hyprland): add compatible mobile MP4s and video posters"
          git push origin HEAD:fix/hyprland-mobile-video-loading
