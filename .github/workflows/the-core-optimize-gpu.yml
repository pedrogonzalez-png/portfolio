name: One-time optimize THE CORE CC0 GPU GLB

on:
  push:
    branches: [feat/the-core-vertical-slice-m0]
    paths: [.github/workflows/the-core-optimize-gpu.yml]

permissions:
  contents: write

jobs:
  optimize-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/the-core-vertical-slice-m0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Keep geometry intact and resize/recompress PBR maps
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @gltf-transform/cli@4.5.1
          cp public/assets/the-core/gpu-generic-cc0.glb /tmp/gpu-original.glb
          gltf-transform resize /tmp/gpu-original.glb /tmp/gpu-resized.glb --width 1024 --height 1024
          gltf-transform webp /tmp/gpu-resized.glb public/assets/the-core/gpu-generic-cc0.glb
      - name: Verify GLB v2 and built-in geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,json
          p=Path("public/assets/the-core/gpu-generic-cc0.glb")
          data=p.read_bytes()
          assert 100_000<len(data)<20_000_000
          assert data[:4]==b"glTF"
          version,length=struct.unpack_from("<II",data,4)
          assert version==2 and length==len(data)
          sz,typ=struct.unpack_from("<I4s",data,12)
          assert typ==b"JSON"
          gltf=json.loads(data[20:20+sz].decode())
          assert gltf.get("meshes")
          assert not ({"EXT_meshopt_compression","KHR_draco_mesh_compression"} & set(gltf.get("extensionsUsed",[])))
          print("GPU optimized",len(data),"bytes",len(gltf["meshes"]),"meshes")
          PY
      - name: Save optimized CC0 GPU on preview only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/the-core/gpu-generic-cc0.glb
          git commit -m "assets(the-core): otimizar GPU CC0 para carregamento rápido"
          git push origin HEAD:feat/the-core-vertical-slice-m0
