name: THE CORE - import CC0 PSU and RAM GLBs (one-off)

on:
  push:
    branches: [feat/the-core-vertical-slice-m0]
    paths: [".github/workflows/the-core-import-m07.yml"]

permissions:
  contents: write

jobs:
  import-cc0-assets:
    if: github.ref == 'refs/heads/feat/the-core-vertical-slice-m0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/the-core-vertical-slice-m0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download source GLBs from CC0 Innerscene library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/the-core-m07 public/assets/the-core
          curl --fail --location --retry 3 --max-time 180 \
            "https://www.innerscene.com/api/library/atx-power-supply-675d6448/download" \
            -o /tmp/the-core-m07/psu.glb
          curl --fail --location --retry 3 --max-time 180 \
            "https://www.innerscene.com/api/library/ddr5-ram-stick-376e4682/download" \
            -o /tmp/the-core-m07/ram.glb
          python3 - <<'PY'
          from pathlib import Path
          for name in ("psu","ram"):
              raw = Path("/tmp/the-core-m07/"+name+".glb").read_bytes()
              if len(raw) < 10000 or raw[:4] != b"glTF" or int.from_bytes(raw[4:8],"little") != 2:
                  raise SystemExit("Invalid source GLB: "+name)
              print(name, len(raw), "bytes")
          PY
      - name: Optimize for WebGL with portable quantization and WebP
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/the-core-m07/tool --no-save @gltf-transform/cli@4.5.1
          CLI=/tmp/the-core-m07/tool/node_modules/.bin/gltf-transform
          "$CLI" optimize /tmp/the-core-m07/psu.glb public/assets/the-core/psu-atx-cc0.glb --compress quantize --texture-compress webp --texture-size 1024
          "$CLI" optimize /tmp/the-core-m07/ram.glb public/assets/the-core/ram-ddr5-cc0.glb --compress quantize --texture-compress webp --texture-size 1024
          python3 - <<'PY'
          from pathlib import Path
          for name in ("psu-atx-cc0.glb","ram-ddr5-cc0.glb"):
              raw = Path("public/assets/the-core",name).read_bytes()
              if raw[:4] != b"glTF" or len(raw) > 10_000_000:
                  raise SystemExit("Invalid/oversized optimized GLB: "+name+" "+str(len(raw)))
              print(name,len(raw),"bytes")
          PY
      - name: Commit optimized files ONLY to the experimental branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/the-core-vertical-slice-m0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/the-core/psu-atx-cc0.glb public/assets/the-core/ram-ddr5-cc0.glb
          if ! git diff --cached --quiet; then
            git commit -m "assets(the-core): import optimized CC0 PSU and DDR5 GLBs"
            git push origin HEAD:feat/the-core-vertical-slice-m0
          fi
