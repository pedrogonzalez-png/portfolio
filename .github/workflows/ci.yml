name: CI

on:
  push:
    branches: [main]
  pull_request: {} # Validate stacked PRs as well as PRs targeting main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app and tooling)
        run: npm run typecheck

      - name: Test (unit and integration)
        run: npm run test

      - name: Generate approved GitHub index (optional network cache)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-github-index.mjs

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check (advisory until baseline is cleaned)
        continue-on-error: true
        run: npx prettier --check "src/**/*.{ts,tsx,css,md,json}"
