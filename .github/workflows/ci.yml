name: CI

on:
  push: {} # Run checks for feature branches before merging into main
  pull_request: {} # Validate stacked PRs as well as PRs targeting main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app and tooling)
        run: npm run typecheck

      - name: Test (unit and integration)
        run: npm run test

      - name: Generate approved GitHub index (optional network cache)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-github-index.mjs

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check (advisory until baseline is cleaned)
        continue-on-error: true
        run: npx prettier --check "src/**/*.{ts,tsx,css,md,json}"

  generate-mobile-video-media:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/hyprland-mobile-video-loading'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hyprland-mobile-video-loading
      - name: Install ffmpeg if absent
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate compatible mobile MP4s and posters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/hyprland/temas/videos-mobile public/assets/hyprland/temas/posters
          for name in changli hyuki hsin shorekeeper wutering; do
            source="public/assets/hyprland/temas/videos-fundo/$name.mp4"
            mobile="public/assets/hyprland/temas/videos-mobile/$name.mp4"
            poster="public/assets/hyprland/temas/posters/$name.jpg"
            test -s "$source"
            if [[ ! -s "$mobile" ]]; then
              ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$source"
              ffmpeg -hide_banner -loglevel error -nostdin -y -i "$source" -map 0:v:0 -an \
                -vf "scale='min(1280,iw)':-2,fps=24" -c:v libx264 -preset veryfast \
                -crf 27 -pix_fmt yuv420p -profile:v main -level:v 3.1 \
                -movflags +faststart -maxrate 1800k -bufsize 3600k "$mobile"
            fi
            if [[ ! -s "$poster" ]]; then
              ffmpeg -hide_banner -loglevel error -nostdin -y -ss 0.5 -i "$source" \
                -map 0:v:0 -frames:v 1 -vf "scale='min(960,iw)':-2" -q:v 4 "$poster"
            fi
            test -s "$mobile"
            test -s "$poster"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of default=noprint_wrappers=1 "$mobile"
            ls -lh "$mobile" "$poster"
          done
      - name: Commit media to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/hyprland/temas/videos-mobile/ public/assets/hyprland/temas/posters/
          if ! git diff --cached --quiet; then
            git commit -m "assets(hyprland): add mobile H264 videos and preview posters"
            git push origin HEAD:fix/hyprland-mobile-video-loading
          fi
