name: One-time import licensed CC0 case and motherboard GLBs

on:
  push:
    branches:
      - feat/the-core-vertical-slice-m0
    paths:
      - .github/workflows/the-core-import-shell.yml

permissions:
  contents: write

jobs:
  import-models:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/the-core-vertical-slice-m0

      - name: Install Node and glTF image optimizer
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download original Innerscene models (CC0)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/the-core
          curl --fail --location --silent --show-error --retry 3 \
            --max-time 180 --user-agent "THE-CORE-educational-portfolio/1.0" \
            "https://www.innerscene.com/api/library/closed-mid-tower-pc-case-1374583e/download" \
            --output /tmp/case-original.glb
          curl --fail --location --silent --show-error --retry 3 \
            --max-time 180 --user-agent "THE-CORE-educational-portfolio/1.0" \
            "https://www.innerscene.com/api/library/atx-motherboard-7794769f/download" \
            --output /tmp/board-original.glb

      - name: Resize embedded PBR maps and encode WebP without geometry compression
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @gltf-transform/cli@4.5.1
          gltf-transform resize /tmp/case-original.glb /tmp/case-resized.glb --width 1024 --height 1024
          gltf-transform webp /tmp/case-resized.glb public/assets/the-core/case-mid-tower-cc0.glb
          gltf-transform resize /tmp/board-original.glb /tmp/board-resized.glb --width 1024 --height 1024
          gltf-transform webp /tmp/board-resized.glb public/assets/the-core/motherboard-atx-cc0.glb

      - name: Validate GLB v2 and print node/material metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          for name in ["case-mid-tower-cc0.glb", "motherboard-atx-cc0.glb"]:
              path = Path("public/assets/the-core") / name
              data = path.read_bytes()
              assert 100_000 < len(data) < 40_000_000, (name,len(data))
              assert data[:4] == b"glTF", (name,"not GLB")
              version,length = struct.unpack_from("<II",data,4)
              assert version == 2 and length == len(data), (name,"bad header")
              chunk_length, chunk_type = struct.unpack_from("<I4s",data,12)
              assert chunk_type == b"JSON", name
              document = json.loads(data[20:20+chunk_length].decode("utf8"))
              extensions = document.get("extensionsUsed",[])
              assert "EXT_meshopt_compression" not in extensions, extensions
              assert "KHR_draco_mesh_compression" not in extensions, extensions
              assert len(document.get("meshes", [])) > 0, name
              assert all(not b.get("uri") for b in document.get("buffers",[])), name
              assert all(not i.get("uri") for i in document.get("images",[])), name
              print(f"{name}: {len(data):,} bytes, {len(document.get('meshes',[]))} meshes, {len(document.get('materials',[]))} materials, extensions={extensions}")
              print("  material names:", [m.get("name","") for m in document.get("materials",[])][:24])
              print("  node names:",[n.get("name","") for n in document.get("nodes",[])][:36])
          PY

      - name: Commit binary models to THE CORE preview branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/the-core/case-mid-tower-cc0.glb \
            public/assets/the-core/motherboard-atx-cc0.glb
          git commit -m "assets(the-core): modelos CC0 de gabinete e placa-mãe otimizados"
          git push origin HEAD:feat/the-core-vertical-slice-m0
